---
version: 0.1

runtime:
  language: python
  version: "3"

globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: win

autosplit: true
retryOnFailure: true

maxRetries: 1
concurrency: 2

env:
  TARGET_OS: Windows 10

cacheKey: '{{ checksum "requirements.txt" }}'

cacheDirectories:
  - CacheDir

pre:
  - pip install py
  - pip3 install -r requirements.txt --cache-dir CacheDir

post:
  - type yaml\win\pytest_hyperexecute_autosplit_sample.yaml

mergeArtifacts: true

uploadArtefacts:
  - name: TestReports
    path:
      - reports/**

report: true

partialReports:
  type: json
  location: reports/
  frameworkName: extent

testDiscovery:
  type: raw
  mode: remote
  command: dir /s /b tests\*.py

testRunnerCommand: pytest -s --verbose --html=reports/report.html $test

jobLabel:
  - selenium-pytest
  - win
  - autosplit