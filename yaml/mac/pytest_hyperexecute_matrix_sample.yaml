---
version: 0.1

runtime:
  language: python
  version: "3.11"

globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

matrix:
  files:
    - "tests/lt_sample_todo.py"
    - "tests/lt_selenium_playground.py"

runson: mac

retryOnFailure: true
maxRetries: 1

env:
  TARGET_OS: MacOS Catalina

cacheKey: '{{ checksum "requirements.txt" }}'

cacheDirectories:
  - CacheDir

pre:
  - pip install py
  - pip3 install -r requirements.txt --cache-dir CacheDir

post:
  - cat yaml/mac/pytest_hyperexecute_matrix_sample.yaml

mergeArtifacts: true

uploadArtefacts:
  - name: TestReports
    path:
      - reports/**

report: true

partialReports:
  type: json
  location: reports/
  frameworkName: extent

testSuites:
  - python3 -m pytest -s --verbose --html=reports/report.html $files

jobLabel:
  - selenium-pytest
  - mac
  - matrix